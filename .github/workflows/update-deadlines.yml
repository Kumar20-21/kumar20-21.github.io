name: Update Conference Deadlines & Ranks

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:00 UTC. GitHub may delay scheduled workflows during high load.
    - cron: '00 7 * * *'

permissions:
  contents: write

concurrency:
  group: conference-deadline-refresh
  cancel-in-progress: false

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run deadline, edition-discovery, and rank crawler
        run: node scripts/update-deadlines.js

      - name: Verify crawl health
        env:
          MIN_CRAWL_SUCCESS: "1"
          MIN_CRAWL_SUCCESS_RATE: "0.50"
        run: node scripts/verify-crawl-health.js data/deadlines.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json
          if git diff --cached --quiet; then
            echo "No deadline updates to commit"
            exit 0
          fi
          git commit -m "chore: automated deadline and edition refresh"
          git push
