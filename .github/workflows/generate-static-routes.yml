name: Generate Static Routes

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - app.js
      - style.css
      - scripts/generate-static-routes.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-routes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate route pages
        run: node scripts/generate-static-routes.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aboutme projects publications blog conference-tracker
          if git diff --cached --quiet; then
            echo "No route pages to update"
            exit 0
          fi
          git commit -m "chore: regenerate static route pages"
          git push
